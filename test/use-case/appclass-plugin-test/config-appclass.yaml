# KLASTOS counterpart of ../multi-tenancy/config.yaml, adapted for
# Experiment 1's apples-to-apples harness — same structural pattern as
# ../data-sovereignty-klastos/config-klastos.yaml, differences noted below.
#
#   - namespaceList (a literal namespace name, templated via NAMESPACE),
#     not namespace.prefix+number. Tenant identity here IS the namespace
#     (harness/apply-class-policy.sh creates uc1/uc2 directly, mirroring
#     the baseline's own ../multi-tenancy/config.yaml NAMESPACE pattern)
#     rather than data-sovereignty's single CL2-managed shared namespace.
#     enableExistingNamespaces: true because the harness (not CL2) owns
#     namespace lifecycle.
#   - Two pod templates (POD_SPEC_A/POD_SPEC_B) instead of one POD_SPEC,
#     same reason as data-sovereignty-klastos: every pod must belong to
#     one of an AppGroup's exactly-2 workloads (Diktyo's minimum - see
#     harness/policy/appgroup-template.yaml).
#   - No admission-latency measurement (OPA/webhook). The baseline's own
#     GatekeeperValidationRequestDuration/GatekeeperMutationRequestDuration
#     aren't meaningful on this side either way, but note for future
#     reference: as of this writing the currently-deployed KLASTOS
#     admission controller is csi-gate-webhook, which exposes no
#     Prometheus metrics at all (confirmed this session) - unlike OPA,
#     which does (see data-sovereignty-klastos's own
#     OPAAdmissionRequestDuration). Add that measurement back here if/when
#     OPA is the deployed controller again.

{{$totalSchedulerThroughputPods := DefaultParam .CL2_SCHEDULER_THROUGHPUT_PODS 5000}}
{{$halfPods := DivideInt $totalSchedulerThroughputPods 2}}
{{$defaultQps := DefaultParam .CL2_DEFAULT_QPS  500}}
{{$defaultBurst := DefaultParam .CL2_DEFAULT_BURST 1000}}
{{$uniformQps := DefaultParam .CL2_UNIFORM_QPS 500}}

{{$SCHEDULER_THROUGHPUT_THRESHOLD := DefaultParam .CL2_SCHEDULER_THROUGHPUT_THRESHOLD 400}}

{{$namespace := DefaultParam .NAMESPACE "appclass-test-a"}}
{{$podSpecA := DefaultParam .POD_SPEC_A "appclass-test-a/workload-a.yaml"}}
{{$podSpecB := DefaultParam .POD_SPEC_B "appclass-test-a/workload-b.yaml"}}

name: appclass-plugin-scheduler-throughput
namespace:
  enableExistingNamespaces: true
tuningSets:
- name: default
  globalQPSLoad:
    qps: {{$defaultQps}}
    burst: {{$defaultBurst}}
- name: UniformQPS
  qpsLoad:
    qps: {{$uniformQps}}
steps:
- name: Creating scheduler throughput measurements
  measurements:
  - Identifier: DirectSchedulingThroughput
    Method: SchedulingThroughput
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      measurementInterval: 1s

  - Identifier: APIAvailability
    Method: APIAvailability
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      pollFrequency: 1s

  - Identifier: APIResponsivenessPrometheus
    Method: APIResponsivenessPrometheus
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput

  - Identifier: SchedulingMetrics
    Method: SchedulingMetrics
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      measurementInterval: 1s

  - Identifier: SchedulingThroughputPrometheus
    Method: SchedulingThroughputPrometheus
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      measurementInterval: 1s

- name: create scheduler throughput pods
  phases:
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: {{$halfPods}}
    tuningSet: UniformQPS
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-a
      objectTemplatePath: {{$podSpecA}}
      templateFillMap:
        Group: direct-scheduler-throughput
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: {{$halfPods}}
    tuningSet: UniformQPS
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-b
      objectTemplatePath: {{$podSpecB}}
      templateFillMap:
        Group: direct-scheduler-throughput
- name: Waiting for scheduler throughput pods to be created
  measurements:
  - Identifier: WaitForDirectSchedulerThroughputPods
    Method: WaitForRunningPods
    Params:
      action: gather
      timeout: 5m
      desiredPodCount: {{$totalSchedulerThroughputPods}}
      labelSelector: group = direct-scheduler-throughput
- name: Collecting scheduler throughput measurements
  measurements:
  - Identifier: APIAvailability
    Method: APIAvailability
    Params:
      action: gather
  - Identifier: APIResponsivenessPrometheus
    Method: APIResponsivenessPrometheus
    Params:
      action: gather
  - Identifier: SchedulingMetrics
    Method: SchedulingMetrics
    Params:
      action: gather
  - Identifier: DirectSchedulingThroughput
    Method: SchedulingThroughput
    Params:
      action: gather
      enableViolations: true
      threshold: {{$SCHEDULER_THROUGHPUT_THRESHOLD}}
  - Identifier: SchedulingThroughputPrometheus
    Method: SchedulingThroughputPrometheus
    Params:
      action: gather
- name: Delete scheduler throughput pods
  phases:
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: 0
    tuningSet: default
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-a
      objectTemplatePath: {{$podSpecA}}
      templateFillMap:
        Group: direct-scheduler-throughput
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: 0
    tuningSet: default
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-b
      objectTemplatePath: {{$podSpecB}}
      templateFillMap:
        Group: direct-scheduler-throughput
