# KLASTOS counterpart of ../multi-tenancy/config.yaml, for the "AppClass"
# scheduler-plugin variant (klastos/experiment1/multi-tenancy/
# harness-appclass-plugin/) — no CSC/UCSS, no gating admission controller
# at all in this mode (see that harness's own README.md).
#
#   - namespaceList (a literal namespace name, templated via NAMESPACE),
#     not namespace.prefix+number. Tenant identity here IS the namespace
#     (harness-appclass-plugin/apply-class-policy.sh creates the namespace
#     directly). enableExistingNamespaces: true because the harness (not
#     CL2) owns namespace lifecycle.
#   - Two pod templates (POD_SPEC_A/POD_SPEC_B) instead of one POD_SPEC,
#     same reason as the other multi-tenancy variants: every pod must
#     belong to one of an AppGroup's exactly-2 workloads (Diktyo's
#     minimum - see harness-appclass-plugin/policy/appgroup-template.yaml).
#   - No admission-latency measurement at all — this mode has no gating
#     admission controller of any kind (confirmed live:
#     deploy-klastos-stack.sh APPCLASS_PLUGIN_ONLY=true skips both OPA and
#     csi-gate-webhook).
#   - CL2_SCHEDULER_THROUGHPUT_THRESHOLD default is 30, not the 400 the
#     sibling config-klastos.yaml uses — confirmed live this is NOT
#     interchangeable: the AppClass scheduler plugin's PreFilter lists
#     every AppGroup-labeled pod cluster-wide and rebuilds satisfied/
#     violated maps per node on every scheduling decision (see
#     nestor-scheduling-work/pkg/security/appclass.go), a fundamentally
#     more expensive per-pod cost than the CSC/ClassScheduling path 400
#     was calibrated for. Observed actual throughput was ~66 pods/sec at
#     N=1000 on this cluster; 30 leaves margin below that for run-to-run
#     variance rather than being a bare pass/fail coin flip. Override
#     CL2_SCHEDULER_THROUGHPUT_THRESHOLD explicitly for your own N/cluster
#     rather than trusting this default blindly.

{{$totalSchedulerThroughputPods := DefaultParam .CL2_SCHEDULER_THROUGHPUT_PODS 5000}}
{{$halfPods := DivideInt $totalSchedulerThroughputPods 2}}
{{$defaultQps := DefaultParam .CL2_DEFAULT_QPS  500}}
{{$defaultBurst := DefaultParam .CL2_DEFAULT_BURST 1000}}
{{$uniformQps := DefaultParam .CL2_UNIFORM_QPS 500}}

{{$SCHEDULER_THROUGHPUT_THRESHOLD := DefaultParam .CL2_SCHEDULER_THROUGHPUT_THRESHOLD 30}}

{{$namespace := DefaultParam .NAMESPACE "appclass-test-a"}}
{{$podSpecA := DefaultParam .POD_SPEC_A "appclass-test-a/workload-a.yaml"}}
{{$podSpecB := DefaultParam .POD_SPEC_B "appclass-test-a/workload-b.yaml"}}

name: appclass-plugin-scheduler-throughput
namespace:
  enableExistingNamespaces: true
tuningSets:
- name: default
  globalQPSLoad:
    qps: {{$defaultQps}}
    burst: {{$defaultBurst}}
- name: UniformQPS
  qpsLoad:
    qps: {{$uniformQps}}
steps:
- name: Creating scheduler throughput measurements
  measurements:
  - Identifier: DirectSchedulingThroughput
    Method: SchedulingThroughput
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      measurementInterval: 1s

  - Identifier: APIAvailability
    Method: APIAvailability
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      pollFrequency: 1s

  - Identifier: APIResponsivenessPrometheus
    Method: APIResponsivenessPrometheus
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput

  - Identifier: SchedulingMetrics
    Method: SchedulingMetrics
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      measurementInterval: 1s

  - Identifier: SchedulingThroughputPrometheus
    Method: SchedulingThroughputPrometheus
    Params:
      action: start
      labelSelector: group = direct-scheduler-throughput
      measurementInterval: 1s

- name: create scheduler throughput pods
  phases:
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: {{$halfPods}}
    tuningSet: UniformQPS
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-a
      objectTemplatePath: {{$podSpecA}}
      templateFillMap:
        Group: direct-scheduler-throughput
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: {{$halfPods}}
    tuningSet: UniformQPS
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-b
      objectTemplatePath: {{$podSpecB}}
      templateFillMap:
        Group: direct-scheduler-throughput
- name: Waiting for scheduler throughput pods to be created
  measurements:
  - Identifier: WaitForDirectSchedulerThroughputPods
    Method: WaitForRunningPods
    Params:
      action: gather
      timeout: 5m
      desiredPodCount: {{$totalSchedulerThroughputPods}}
      labelSelector: group = direct-scheduler-throughput
- name: Collecting scheduler throughput measurements
  measurements:
  - Identifier: APIAvailability
    Method: APIAvailability
    Params:
      action: gather
  - Identifier: APIResponsivenessPrometheus
    Method: APIResponsivenessPrometheus
    Params:
      action: gather
  - Identifier: SchedulingMetrics
    Method: SchedulingMetrics
    Params:
      action: gather
  - Identifier: DirectSchedulingThroughput
    Method: SchedulingThroughput
    Params:
      action: gather
      enableViolations: true
      threshold: {{$SCHEDULER_THROUGHPUT_THRESHOLD}}
  - Identifier: SchedulingThroughputPrometheus
    Method: SchedulingThroughputPrometheus
    Params:
      action: gather
- name: Delete scheduler throughput pods
  phases:
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: 0
    tuningSet: default
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-a
      objectTemplatePath: {{$podSpecA}}
      templateFillMap:
        Group: direct-scheduler-throughput
  - namespaceList:
    - {{$namespace}}
    replicasPerNamespace: 0
    tuningSet: default
    objectBundle:
    - basename: klastos-scheduler-throughput-pod-b
      objectTemplatePath: {{$podSpecB}}
      templateFillMap:
        Group: direct-scheduler-throughput
