# Experiment 14 pod, workload b of its tenant. The tenant is the namespace,
# its AppGroup is <namespace>-app (created by the KLASTOS harness; the baselines ignore the labels and add the tenant label).
# No class-keys annotation: the class must be derived by classification (see Nestor-paper AGENTS.md).
apiVersion: v1
kind: Pod
metadata:
  generateName: klastos-mt14-b-
  labels:
    appgroup.diktyo.x-k8s.io: {{.Namespace}}-app
    appgroup.diktyo.x-k8s.io.workload: {{.Namespace}}-workload-b
    group: {{.Group}}
spec:
  containers:
  - image: registry.k8s.io/pause:3.9
    name: pause
